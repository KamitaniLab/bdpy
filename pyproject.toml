[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bdpy"
version = "0.26"
description = "Brain decoder toolbox for Python"
authors = [
    { name = "Shuntaro C. Aoki", email = "s_aoki@i.kyoto-u.ac.jp" }
]
readme = "README.md"
requires-python = ">= 3.8, < 3.12"
license = { file = "LICENSE" }
keywords = ["neuroscience", "neuroimaging", "brain decoding", "fmri", "machine learning"]

dependencies = [
    "numpy>=1.20,<2; python_version < '3.10'",
    "numpy>=1.20; python_version >= '3.10'",
    "scipy",
    "scikit-learn",
    "h5py>=3.0",
    "hdf5storage",
    "pyyaml",
    "pandas",
    "tqdm",
    "typing-extensions>=4.5.0"
]

[project.optional-dependencies]
caffe = [
    "Pillow",
]
torch = [
    "torch",
    "torchvision",
    "Pillow"
]
fig = [
    "matplotlib",
    "Pillow"
]
mri = [
    "nibabel>=3.2,<6",
    "nipy>=0.6.1"
]
pipeline = [
    "hydra-core",
    "omegaconf"
]
all = [
    "bdpy[caffe]",
    "bdpy[torch]",
    "bdpy[fig]",
    "bdpy[mri]",
    "bdpy[pipeline]"
]
dev = [
    "bdpy[all]",
    "fastl2lir"
]

[project.urls]
Homepage = "https://github.com/KamitaniLab/bdpy"
Repository = "https://github.com/KamitaniLab/bdpy"
"Bug Tracker" = "https://github.com/KamitaniLab/bdpy/issues"

[dependency-groups]
dev = [
    "bdpy[dev]",
    "jupyter",
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy"
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]

[tool.uv]
default-groups = ["dev"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
only-include = ["bdpy"]

[tool.hatch.build.targets.sdist]
only-include = ["bdpy"]

[tool.ruff]
exclude = ["tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "D", "ANN", "B", "NPY", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.extend-per-file-ignores]
"__init__.py" = ["F401"]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.pylint]
disable = "line-too-long"
