name: test_old

on:
  push:
    branches: [ "maintenance/legacy" ]

jobs:
  test_py36:
    runs-on: ubuntu-22.04

    # NOTE: Python 3.6 is not supported in Ubuntu 22.04, so we use a container with Python 3.6 installed.
    container:
      image: python:3.6-buster
    steps:
    - uses: actions/checkout@v6

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov pytest-github-actions-annotate-failures
        pip install Cython==0.29.36 numpy
        pip install .[dev]

    - name: Test with pytest
      run: |
        (
          set -o pipefail
          pytest \
            --ignore=tests/dl/torch \
            --ignore=tests/recon/torch \
            --ignore=tests/task \
            --junitxml=pytest.yml \
            --cov-report=term-missing:skip-covered --cov=bdpy tests | tee pytest-coverage.txt
        )


  test_py37:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7"]

    steps:
    - uses: actions/checkout@v6

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: "pip"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest pytest-cov pytest-github-actions-annotate-failures
        pip install Cython==0.29.36 numpy
        pip install .[dev]

    - name: Test with pytest
      run: |
        (
          set -o pipefail
          pytest \
            --junitxml=pytest.yml \
            --cov-report=term-missing:skip-covered --cov=bdpy tests | tee pytest-coverage.txt
        )
